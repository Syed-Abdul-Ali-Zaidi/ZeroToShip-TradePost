<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>
        {% block title %}TradePost{% endblock %}
    </title>
    <!-- Corrected Bootstrap version to 5.3.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        (function () {
            const saved = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-bs-theme", saved);
        })();
    </script>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold text-primary" href="/posts/">TradePost</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <select id="statusFilter" class="form-select ms-3 d-none" style="max-width: 140px;" aria-label="Filter by status">
                    <option value="">All</option>
                    <option value="Open">Open</option>
                    <option value="Traded">Traded</option>
                </select>

                <div class="d-flex align-items-center" ms-auto>
                    <div id="auth-nav" class="d-flex gap-2"></div>
                    <button class="theme-toggle-btn ms-3 btn btn-link text-body" id="themeToggleBtn" type="button" aria-label="Toggle color theme">
                        <i class="bi bi-moon-stars-fill" id="themeToggleIcon"></i>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <div class="container mt-4">
        {% block content %}
        {% endblock %}
    </div>

    <script src="/static/js/auth.js"></script>
    <script>
        (function () {
            const root = document.documentElement;
            const btn = document.getElementById("themeToggleBtn");
            const icon = document.getElementById("themeToggleIcon");

            function updateIcon(theme) {
                icon.className = theme === "dark" ? "bi bi-moon-stars-fill" : "bi bi-sun-fill";
            }
            updateIcon(root.getAttribute("data-bs-theme") || "dark");

            btn.addEventListener("click", function () {
                const current = root.getAttribute("data-bs-theme") === "dark" ? "light" : "dark";
                root.setAttribute("data-bs-theme", current);
                localStorage.setItem("theme", current);
                updateIcon(current);
            });
        })();
    </script>
</body>
</html>
