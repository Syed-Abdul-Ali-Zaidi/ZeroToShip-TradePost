{% extends "layout.html" %}
{% block title %}My Offers - TradePost{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-9 col-xl-8">
        
        <div class="d-flex justify-content-between align-items-center my-4">
            <h2 class="mb-0 page-heading">My Outbound Offers</h2>
            <a class="btn btn-outline-primary" href="/posts/" role="button">
                <i class="bi bi-shop"></i> Browse Marketplace
            </a>
        </div>

        <!-- The container for your outbound offers -->
        <div id="my-offers-grid">
            
            <!-- JavaScript will inject cards here. Example structure JS will build:
                 <div class="card shadow-sm mb-4">
                     <div class="card-header bg-light">
                         <small class="text-muted">Target Post: <strong>Vintage Acoustic Guitar</strong></small>
                     </div>
                     <div class="card-body">
                         <p><strong>Your Proposal:</strong> I can offer my...</p>
                         <span class="badge bg-secondary">[Waiting for Peer]</span>
                     </div>
                     <div class="card-footer d-flex justify-content-end">
                         <button class="btn btn-sm btn-outline-danger">Withdraw Offer</button>
                     </div>
                 </div>
            -->
            
            <div class="text-center text-muted py-5" id="offers-loading-spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2">Loading your offers...</p>
            </div>
        </div>

    </div>
</div>
<!-- Connect the specific script for offers logic -->
<script src="/static/js/offers.js"></script>
{% endblock %}
