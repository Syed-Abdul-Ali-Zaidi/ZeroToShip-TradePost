{% extends "layout.html" %}
{% block title %}My Offers - TradePost{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-xl-11">
        
        <div class="d-flex justify-content-between align-items-start my-4 page-header">
            <div>
                <h2 class="mb-0 page-heading">My Outbound Offers</h2>
                <p class="page-subtext mt-1">Track the trades you've proposed to other members.</p>
            </div>
            <a class="btn btn-outline-primary" href="/posts/" role="button">
                <i class="bi bi-shop"></i> Browse Marketplace
            </a>
        </div>

        <!-- The container for your outbound offers -->
        <div id="my-offers-grid" class="grid-feed">
            <!-- JavaScript will inject offer-summary-card elements here -->
            <div class="feed-state" id="offers-loading-spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2 mb-0">Loading your offers...</p>
            </div>
        </div>

    </div>
</div>
<!-- Connect the specific script for offers logic -->
<script src="/static/js/offers.js"></script>
{% endblock %}
