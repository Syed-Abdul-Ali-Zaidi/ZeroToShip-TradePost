{% extends "layout.html" %}
{% block title %}Propose Trade - TradePost{% endblock %}
{% block content %}
<div class="auth-wrapper d-flex justify-content-center mt-4">
    <div class="auth-card card shadow p-4" style="width: 100%; max-width: 600px;">
        <h2 class="page-heading mb-2">Propose an Offer</h2>
        <p class="text-muted mb-4">Detail what you are willing to trade for this item.</p>

        <form id="offerCreateForm">
            <!-- Hidden field populated by JS via URL parameter -->
            <input type="hidden" id="targetPostId"> 

            <div class="mb-4">
                <label for="offerMessage" class="form-label fw-semibold">Your Proposal</label>
                <textarea class="form-control" id="offerMessage" rows="5" placeholder="I can offer my..." required></textarea>
            </div>
            
            <button class="btn btn-primary w-100" type="submit" id="submitOfferBtn">Send Offer</button>
        </form>
        <button onclick="history.back()" class="btn btn-link mt-3 text-decoration-none p-0">&larr; Cancel</button>
    </div>
</div>
<script src="/static/js/offers.js"></script>
{% endblock %}
