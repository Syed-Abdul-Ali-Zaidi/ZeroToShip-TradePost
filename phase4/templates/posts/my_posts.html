{% extends "layout.html" %}
{% block title %}My Listings - TradePost{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-9 col-xl-8">
        <div class="d-flex justify-content-between align-items-center my-4">
            <h2 class="mb-0 page-heading">My Active Listings</h2>
            <a class="btn btn-primary" href="/posts/create_post" role="button">
                <i class="bi bi-plus-lg"></i> Create Post
            </a>
        </div>

        <!-- The container for personal posts -->
        <div id="my-posts-grid">
            <div class="text-center text-muted py-5" id="my-posts-loading-spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2">Loading your listings...</p>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/posts.js"></script>
{% endblock %}
