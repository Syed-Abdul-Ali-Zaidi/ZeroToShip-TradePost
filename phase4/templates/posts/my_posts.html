{% extends "layout.html" %}
{% block title %}My Listings - TradePost{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-start my-4 page-header">
            <div>
                <h2 class="mb-0 page-heading">My Active Listings</h2>
                <p class="page-subtext mt-1">Manage the items you've listed and track their status.</p>
            </div>
            <a class="btn btn-primary" href="/posts/create_post" role="button">
                <i class="bi bi-plus-lg"></i> Create Post
            </a>
        </div>

        <!-- The container for personal posts -->
        <div id="my-posts-grid" class="grid-feed">
            <div class="feed-state" id="my-posts-loading-spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2 mb-0">Loading your listings...</p>
            </div>
        </div>
    </div>
</div>
<script src="/static/js/posts.js"></script>
{% endblock %}
