{% extends "layout.html" %}
{% block title %}Delete Listing{% endblock %}
{% block content %}
<div class="confirm-wrapper d-flex justify-content-center mt-5">
    <div class="confirm-card card shadow text-center p-5" style="max-width: 450px;">
        <i class="bi bi-exclamation-triangle-fill" style="font-size: 3rem; color: #dc3545;"></i>
        <h2 class="page-heading mt-3">Delete this listing?</h2>
        <p class="page-subtext text-muted">This action will remove the item from the marketplace and cancel all active offers. This cannot be undone.</p>

        <div class="d-flex justify-content-center gap-2 mt-4">
            <button class="btn btn-danger" id="confirmDeletePostBtn">Yes, Delete</button>
            <a href="/posts/my_posts" class="btn btn-outline-primary">Cancel</a>
        </div>
    </div>
</div>
<!-- JS logic to extract the post_id from the URL and execute the DELETE request -->
<script src="/static/js/posts.js"></script>
{% endblock %}
