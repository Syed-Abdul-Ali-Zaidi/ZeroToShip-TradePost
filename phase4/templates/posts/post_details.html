{% extends "layout.html" %}
{% block title %}Listing Details - TradePost{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-9 col-xl-8">
        
        <!-- Post Details Container -->
        <div id="post-details-container" class="feed-card card shadow-sm p-4 mb-4">
            <!-- JS will inject the specific post data here -->
        </div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 id="offersHeading" class="fw-bold m-0">Active Offers</h4>
            <a href="/offers/create_offer" id="makeOfferBtn" class="btn btn-sm btn-outline-primary">
                <i class="bi bi-arrow-left-right"></i> Propose Trade
            </a>
        </div>

        <!-- Inbound Offers Container -->
        <div id="post-offers-container">
            <!-- JS will inject offers here. It will include logic to display: -->
            <!-- <span class="badge bg-warning text-dark">[Your Turn]</span> -->
            <!-- <span class="badge bg-secondary">[Waiting for Peer]</span> -->
        </div>

    </div>
</div>
<script src="/static/js/offers.js"></script>
{% endblock %}
