{% extends "layout.html" %}
{% block title %}Marketplace - TradePost{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-11 col-lg-9 col-xl-8">
        <div class="d-flex justify-content-between align-items-center my-4">
            <h2 class="mb-0 page-heading">Trade Marketplace</h2>
            <a class="btn btn-primary" href="/posts/create_post" role="button">
                <i class="bi bi-plus-lg"></i> New Listing
            </a>
        </div>

        <!-- The grid container your JavaScript will populate -->
        <div id="marketplace-grid">
            <!-- JS will inject feed-cards here based on the design below -->
            <div class="text-center text-muted py-5" id="loading-spinner">
                <div class="spinner-border" role="status"></div>
                <p class="mt-2">Loading marketplace...</p>
            </div>
        </div>
    </div>
</div>
<!-- Connect the specific script for this view -->
<script src="/static/js/posts.js"></script>
{% endblock %}
