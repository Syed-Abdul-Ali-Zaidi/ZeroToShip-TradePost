{% extends "layout.html" %}
{% block title %}Login - TradePost{% endblock %}
{% block content %}
<div class="auth-wrapper d-flex justify-content-center mt-5">
    <div class="auth-card card shadow p-4" style="width: 100%; max-width: 400px;">
        <h2 class="page-heading mb-4 text-center">Login</h2>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button class="btn btn-primary w-100 mt-2" type="submit">Login</button>
        </form>
        <p class="page-subtext text-center mt-3">Don't have an account? <a href="/accounts/register">Register here</a></p>
    </div>
</div>
<script src="/static/js/main.js"></script>
{% endblock %}
